[project]
name = "contextguard-api"
version = "0.0.0"
description = "ContextGuard API application (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "contextguard-contracts",
    "contextguard-policy-dsl",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contextguard_api"]

[tool.uv.sources]
contextguard-contracts = { workspace = true }
contextguard-policy-dsl = { workspace = true }
