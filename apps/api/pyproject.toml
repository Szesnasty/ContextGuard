[project]
name = "contextguard-api"
version = "0.0.0"
description = "ContextGuard API application (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6",
    "structlog>=24",
    "contextguard-contracts",
    "contextguard-policy-dsl",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contextguard"]

[tool.uv.sources]
contextguard-contracts = { workspace = true }
contextguard-policy-dsl = { workspace = true }
