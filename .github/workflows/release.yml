name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish GitHub release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm

      - name: Install locked dependencies
        run: make install

      - name: Run release gate
        run: make ci

      - name: Package web bundle
        run: |
          mkdir -p dist/release
          tar -czf dist/release/contextguard-web.tar.gz -C apps/web/dist .

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/python/*.whl
            dist/python/*.tar.gz
            dist/release/contextguard-web.tar.gz
          generate_release_notes: true

      - name: Upload manual release artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: |
            dist/python/*.whl
            dist/python/*.tar.gz
            dist/release/contextguard-web.tar.gz
          if-no-files-found: error
