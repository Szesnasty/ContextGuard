# Demo identities for the seed corpus.
#
# These map onto `UserContext` (sub, tenant, role, purpose) and are consumed by
# the policy layer and dev JWT stub. The `test_users_yaml_schema` test asserts
# every entry validates as a UserContext.

users:
  - sub: sales@acme
    tenant: acme
    role: sales
    purpose: support
  - sub: legal@acme
    tenant: acme
    role: legal
    purpose: audit
  - sub: admin@acme
    tenant: acme
    role: admin
    purpose: dev
  - sub: support@acme
    tenant: acme
    role: support
    purpose: support
  - sub: user@contoso
    tenant: contoso
    role: sales
    purpose: support
