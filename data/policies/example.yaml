# Example ContextGuard policy (Tier B, zero-infra).
#
# Demonstrates the three things the DSL must express for the leak scenario:
#   1. tenant isolation  — never serve another tenant's chunks (cross-field ref)
#   2. classification gate — sales (and roles inheriting it) cannot see
#      confidential-or-higher chunks (ordered comparison)
#   3. role inheritance  — `manager` inherits `sales`, so the gate applies to it too
#
# Plus the A4 detect→decide→redact loop (risk is a policy *input*, not a hidden
# `if` — ADR-005):
#   4. redact-secrets — any chunk the detectors flag as carrying a secret is
#      redacted (text masked) before it reaches the model (numeric risk input)
#   5. redact-pii — any chunk carrying detected PII is masked before it reaches
#      the model (data minimization at the prompt boundary)
#   6. block-injection — any chunk whose aggregate injection risk score is high
#      (an indirect prompt-injection payload smuggled in a document) is dropped
#
# Rules are evaluated by descending priority; the first fully-matching rule wins.
# If none match, `default_effect` applies. Any `deny` removes the chunk.
version: 1
default_effect: allow

roles:
  manager:
    inherits: [sales]

rules:
  - id: tenant-isolation
    description: A user may never see another tenant's chunks.
    effect: deny
    priority: 100
    when:
      - { field: chunk.tenant, op: neq, ref: user.tenant }

  - id: sales-no-confidential
    description: The sales role cannot access confidential or higher classifications.
    effect: deny
    priority: 50
    when:
      - { field: user.roles, op: contains, value: sales }
      - { field: chunk.classification, op: gte, value: confidential }

  - id: block-injection
    description: Drop chunks carrying a high-confidence prompt-injection payload.
    effect: deny
    priority: 60
    when:
      - { field: chunk.risk_score, op: gte, value: 0.8 }

  - id: redact-secrets
    description: Mask any chunk the detectors flagged as carrying a secret.
    effect: redact
    priority: 40
    when:
      - { field: chunk.secret_count, op: gte, value: 1 }

  - id: redact-pii
    description: Mask any chunk the detectors flagged as carrying PII.
    effect: redact
    priority: 30
    when:
      - { field: chunk.pii_count, op: gte, value: 1 }
