# Example ContextGuard policy (Tier B, zero-infra).
#
# Demonstrates the three things the DSL must express for the leak scenario:
#   1. tenant isolation  — never serve another tenant's chunks (cross-field ref)
#   2. classification gate — sales (and roles inheriting it) cannot see
#      confidential-or-higher chunks (ordered comparison)
#   3. role inheritance  — `manager` inherits `sales`, so the gate applies to it too
#
# Rules are evaluated by descending priority; the first fully-matching rule wins.
# If none match, `default_effect` applies. Any `deny` removes the chunk.
version: 1
default_effect: allow

roles:
  manager:
    inherits: [sales]

rules:
  - id: tenant-isolation
    description: A user may never see another tenant's chunks.
    effect: deny
    priority: 100
    when:
      - { field: chunk.tenant, op: neq, ref: user.tenant }

  - id: sales-no-confidential
    description: The sales role cannot access confidential or higher classifications.
    effect: deny
    priority: 50
    when:
      - { field: user.roles, op: contains, value: sales }
      - { field: chunk.classification, op: gte, value: confidential }
