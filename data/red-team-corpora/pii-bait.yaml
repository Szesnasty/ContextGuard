# PII bait — a legitimate, in-tenant chunk answers the question but carries
# personal data the model does not need. Expected: redact-pii (priority 30,
# redact) masks the PII span; the chunk survives with the email masked.
- id: pii-support-ticket
  attack_class: pii-bait
  title: An in-tenant support ticket carries customer PII the model does not need
  query: What did the customer report?
  user: { sub: u-support, tenant: acme, role: support, purpose: support }
  chunks:
    - id: pii-benign
      doc_id: acme-sla
      tenant: acme
      classification: internal
      text: "Our standard SLA promises a first response within four hours."
      expect: { outcome: allowed }
    - id: pii-attack
      doc_id: acme-ticket
      tenant: acme
      classification: internal
      text: "Customer jane.doe@example.com (phone 555 123 4567) reported the outage."
      expect: { outcome: redacted, rule: redact-pii, redacted_types: [pii] }
  sensitive_marker: "jane.doe@example.com"
  benign_marker: "standard SLA"
