[project]
name = "contextguard"
version = "0.0.0"
description = "Policy-aware context firewall for production RAG — zero-infra Python library (Tier B)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Zero-infra base (ADR-010): nothing heavier than pydantic + pyyaml. Every heavy
# capability is an optional extra, imported lazily so `import contextguard.core`
# never pulls a framework, DB, or model.
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
    "contextguard-contracts",
    "contextguard-policy-dsl",
]

[project.optional-dependencies]
# HTTP adapter (Tier A). Planned public extra: `contextguard[api]`.
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "structlog>=24",
    "pyjwt>=2.8",
    "prometheus-client>=0.20",
]
# Baseline RAG store (Tier A, ADR-008). pgvector-backed vector store + migrations.
pgvector = [
    "sqlalchemy>=2",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
]
# Local embeddings via Ollama (default, offline). Planned public extra: `contextguard[embeddings]`.
embeddings = [
    "httpx>=0.27",
]
# Local LLM via Ollama chat (default, offline). Planned public extra: `contextguard[llm]`.
llm = [
    "httpx>=0.27",
]
# Cross-encoder reranker (`bge-reranker-base`, B3.4). Heavy (pulls torch) and
# off by default (RERANKER=none); planned public extra: `contextguard[rerank]`.
rerank = [
    "sentence-transformers>=3",
]
# Background ingestion via RQ + Redis (Tier A). Planned public extra: `contextguard[ingest]`.
ingest = [
    "rq>=1.16",
    "redis>=5",
]
# Optional cloud embedder/LLM upgrade (OpenAI). Planned public extra: `contextguard[openai]`.
openai = [
    "openai>=1.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contextguard"]

[tool.uv.sources]
contextguard-contracts = { workspace = true }
contextguard-policy-dsl = { workspace = true }
