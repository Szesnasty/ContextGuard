[project]
name = "contextguard-policy-dsl"
version = "0.0.0"
description = "ContextGuard policy DSL parser/evaluator (zero-infra core)"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contextguard_policy_dsl"]
