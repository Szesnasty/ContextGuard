[project]
name = "contextguard-contracts"
version = "1.0.0"
description = "ContextGuard shared contracts (evidence record, policy schema) — pydantic models"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contextguard_contracts"]
