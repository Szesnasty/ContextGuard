# ContextGuard local stack (ADR-003 reference deployment).
# `make up` brings this up healthy and fully offline; `make down` tears it down.
# All host ports are documented in .env.example to avoid collisions.

name: contextguard

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    <<: *restart
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contextguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contextguard}
      POSTGRES_DB: ${POSTGRES_DB:-contextguard}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-contextguard} -d ${POSTGRES_DB:-contextguard}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    <<: *restart
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    <<: *restart
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      # ollama image is minimal; probe the API via its own bundled client.
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  # One-shot: pull default chat + embedding models, then exit 0. Idempotent —
  # ollama skips already-present models. Re-runnable; not a long-lived service.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
      CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:7b}
      EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        ollama pull "$$CHAT_MODEL"
        ollama pull "$$EMBED_MODEL"
        echo "ollama-pull: done"
    restart: "no"

  # Langfuse self-hosted needs its own Postgres; keep it isolated from app data.
  langfuse-db:
    image: postgres:16-alpine
    <<: *restart
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 20

  langfuse:
    image: langfuse/langfuse:2
    <<: *restart
    depends_on:
      langfuse-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:${LANGFUSE_PORT:-3001}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-local-dev-secret-change-me}
      SALT: ${LANGFUSE_SALT:-local-dev-salt-change-me}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_DEFAULT_PROJECT_ID: contextguard
    ports:
      - "${LANGFUSE_PORT:-3001}:3000"
    healthcheck:
      # Langfuse (Next.js) binds to the container hostname, not 127.0.0.1, so
      # probe via $(hostname) rather than localhost.
      test: ["CMD-SHELL", "wget -q --spider http://$(hostname):3000/api/public/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

# Reserved for future Prometheus/Grafana — declared, not populated (step 0.3).
# Start with: docker compose --profile obs up -d
x-obs-profile: &obs-profile
  profiles: ["obs"]

volumes:
  pg_data:
  redis_data:
  ollama_models:
  langfuse_db_data:
