[project]
name = "contextguard-workspace"
version = "0.0.0"
description = "ContextGuard monorepo root (uv workspace anchor)"
requires-python = ">=3.12,<3.13"

[tool.uv.workspace]
members = [
    "packages/contextguard",
    "packages/contracts",
    "packages/policy-dsl",
    "packages/eval-harness",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "hypothesis>=6",
    "psycopg[binary]>=3.2",
    "redis>=5",
    "httpx>=0.27",
    "types-PyYAML>=6",
    # Adapter (Tier A) deps needed to test contextguard.api; end users get these
    # via `local core install[api]` (ADR-013).
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "structlog>=24",
    # Baseline RAG (Tier A) deps for integration tests; end users get these via
    # `local core install[pgvector,embeddings]` (ADR-008/ADR-010).
    "sqlalchemy>=2",
    "pgvector>=0.3",
    "alembic>=1.13",
    "openai>=1.30",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "C4", "SIM", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom: `Depends(...)` in argument defaults is
# intentional and safe, not the mutable-default footgun B008 guards against.
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = [
    "packages/contextguard/src",
    "packages/contracts/src",
    "packages/policy-dsl/src",
    "packages/eval-harness/src",
]
files = [
    "packages/contextguard/src",
    "packages/contracts/src",
    "packages/policy-dsl/src",
    "packages/eval-harness/src",
]
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
# pgvector ships no py.typed marker yet (Tier-A optional dep, ADR-010).
module = ["pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["apps", "packages"]
markers = [
    "integration: requires the local compose stack (run `make up` first)",
    "e2e: full end-to-end flow (slowest tier)",
]
