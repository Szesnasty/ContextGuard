[project]
name = "contextguard-workspace"
version = "0.0.0"
description = "ContextGuard monorepo root (uv workspace anchor)"
requires-python = ">=3.12,<3.13"

[tool.uv.workspace]
members = [
    "apps/api",
    "packages/contracts",
    "packages/policy-dsl",
    "packages/eval-harness",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "hypothesis>=6",
    "psycopg[binary]>=3.2",
    "redis>=5",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps/api/src", "packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "C4", "SIM", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps/api/src", "packages"]
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["apps", "packages"]
markers = [
    "integration: requires the local compose stack (run `make up` first)",
]
